<style>
:root{
  --bg:#f3f6fb;--card:#fff;--line:#e3e8f1;--line2:#eef2f8;--ink:#14213d;--ink2:#4b5875;--mut:#8592ad;
  --pri:#2563eb;--pri2:#1d4ed8;--priL:#e8f0ff;
  --green:#16a34a;--greenL:#e7f7ec;--amber:#b45309;--amberL:#fff4d6;--red:#dc2626;--redL:#fde8e8;--grayL:#eef1f6;
  --side1:#0d1b3a;--side2:#1b3a7a;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Be Vietnam Pro',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.app{display:flex;min-height:100vh}
/* Sidebar */
.side{width:268px;flex:0 0 268px;background:linear-gradient(180deg,var(--side1),var(--side2));color:#dbe5ff;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;gap:12px;align-items:center;padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{width:42px;height:42px;border-radius:12px;background:#3b82f6;display:grid;place-items:center;flex:0 0 42px;box-shadow:0 6px 16px rgba(37,99,235,.45)}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.2px}
.brand small{color:#9fb6ea;font-size:12px}
.nav{padding:8px 12px 16px;flex:1}
.nav h6{margin:18px 10px 6px;font-size:11px;letter-spacing:1.6px;color:#7f9bd6;font-weight:700;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:#e3ebff;text-decoration:none;cursor:pointer;font-size:14px}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:#fff;color:var(--ink);font-weight:600}
.nav a svg{width:18px;height:18px;flex:0 0 18px;opacity:.9}
.nav .bdg{margin-left:auto;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px}
.bdg.r{background:#fde2e2;color:#c81e1e}.bdg.y{background:#fdf0c4;color:#92400e}
.sidenote{margin:0 16px 18px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.06);font-size:12px;color:#c7d5f5}
/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 22px}
.hamb{border:0;background:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--ink2)}
.hamb:hover{background:var(--grayL)}
.ptitle{min-width:0;flex:1}
.ptitle b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle small{color:var(--mut)}
.top select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;min-width:150px}
.saved{color:var(--green);font-size:13px;white-space:nowrap}
.content{padding:22px;flex:1;min-width:0}
.eyebrow{font-size:12px;letter-spacing:1.4px;color:var(--pri);font-weight:700;text-transform:uppercase}
h1{margin:4px 0 4px;font-size:24px}
.lead{color:var(--ink2);margin:0 0 18px}
.head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{margin:0 0 12px;font-size:16px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat .k{color:var(--ink2);font-size:13px}.stat .v{font-size:30px;font-weight:700;margin:2px 0}.stat .s{color:var(--mut);font-size:12.5px}
.bar{height:7px;background:var(--grayL);border-radius:9px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#c8d3e6;background:#f8faff}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.p:hover{background:var(--pri2)}
.btn.g{background:var(--greenL);border-color:#bfe8cb;color:#166534}
.btn.d{color:var(--red);border-color:#f6caca}.btn.d:hover{background:var(--redL)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
table.t{width:100%;border-collapse:separate;border-spacing:0}
table.t th{text-align:left;font-size:12.5px;color:var(--ink2);font-weight:600;background:#f7f9fd;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:#f8fbff}
.tbox{border:1px solid var(--line);border-radius:12px;overflow:auto}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.c-gray{background:var(--grayL);color:#475569}.c-red{background:var(--redL);color:#b91c1c}.c-amber{background:var(--amberL);color:var(--amber)}.c-green{background:var(--greenL);color:#15803d}.c-blue{background:var(--priL);color:var(--pri2)}
.mut{color:var(--mut)}.small{font-size:12.5px}
.list .it{display:flex;gap:14px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--line2)}
.list .it:last-child{border-bottom:0}
.list .dt{width:118px;flex:0 0 118px;color:var(--ink2);font-size:13px}
.list .tx{flex:1;min-width:0}
.sbar{display:flex;align-items:center;gap:12px;margin:9px 0}
.sbar .chip{width:118px;text-align:left}
.sbar .bar{flex:1;margin:0}
.sbar b{width:28px;text-align:right}
/* forms */
label.f{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px;font-weight:500}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;outline:none}
.in:focus{border-color:#93b4f5;box-shadow:0 0 0 3px #e3ecff}
.in[disabled]{background:#f6f8fb;color:#56627e}
textarea.in{resize:vertical;min-height:70px}
.row{display:grid;gap:10px}
.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:repeat(3,1fr)}
.tin{border:1px solid transparent;background:transparent;border-radius:7px;padding:5px 7px;width:100%}
.tin:hover{border-color:var(--line)}.tin:focus{border-color:#93b4f5;background:#fff;outline:none}
.sect{font-size:12px;letter-spacing:1.2px;color:var(--mut);font-weight:700;text-transform:uppercase;margin:18px 0 8px}
.alert{border-radius:12px;padding:10px 13px;margin:10px 0;font-size:13.5px}
.alert.r{background:var(--redL);color:#b91c1c;border:1px solid #f8c9c9}
.alert.y{background:#fff8e6;color:#9a5b05;border:1px solid #f6dfa6}
.alert.g{background:var(--greenL);color:#166534;border:1px solid #bfe8cb}
.alert.b{background:var(--priL);color:#1e40af;border:1px solid #c9dafc}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 15px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* flow */
.flow{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:34px;position:relative;overflow:auto;padding-bottom:6px}
.fcol{background:#f8fafe;border:1px solid var(--line);border-radius:18px;padding:14px;position:relative}
.fcol h4{margin:4px 0 14px;text-align:center;color:var(--pri);letter-spacing:1.3px;font-size:13px}
.fcol:not(:last-child)::after{content:'›';position:absolute;right:-24px;top:50%;font-size:28px;color:#9aa8c4}
.fstep{background:#fff;border:1px solid var(--line);border-top:4px solid var(--pri);border-radius:14px;padding:14px;cursor:pointer;transition:.15s}
.fstep:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,33,61,.08)}
.fstep.done{background:#f3fbf6}
.fstep.warn{border-top-color:#f59e0b}.fstep.ok{border-top-color:var(--green)}
.fstep b{display:block;font-size:15.5px;margin:8px 0 2px}
.fstep .mut{font-size:13px;margin-bottom:8px}
.fnum{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--pri);color:#fff;font-size:13px}
.fnum.ok{background:var(--green)}
.fdown{text-align:center;color:#9aa8c4;margin:4px 0;line-height:1}
.fret{background:var(--redL);color:#b91c1c;border-radius:12px;padding:7px 11px;font-size:12.5px;margin:6px 0}
/* bbnt */
.bb{display:grid;grid-template-columns:280px minmax(340px,430px) minmax(0,1fr);gap:16px;align-items:start}
.bb.noprev{grid-template-columns:280px minmax(0,1fr)}
.bb.noform{grid-template-columns:280px minmax(0,1fr)}.bb.noform.expand{grid-template-columns:minmax(0,1fr)}
.bb.expand{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.bb.expand.noprev{grid-template-columns:minmax(0,1fr)}
.pane{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:80px}
.bitem{padding:10px 10px;border-radius:10px;cursor:pointer;border-bottom:1px solid var(--line2)}
.bitem:hover{background:#f6f9ff}.bitem.on{background:var(--priL)}
.bitem b{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.bitem .nm{font-size:13.5px;color:var(--ink2);margin:2px 0 5px}
.bno{font-family:ui-monospace,Consolas,monospace;font-size:20px;font-weight:700;width:170px}
.chk{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px}
.chk .q{font-size:13.5px;font-weight:500}
.chk .rq{font-size:12px;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.seg button{border:0;background:#fff;padding:4px 10px;cursor:pointer;font-size:12.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.ok{background:var(--green);color:#fff}.seg button.on.ng{background:var(--red);color:#fff}
.seg button[disabled]{cursor:default}
.hist{font-size:12.5px;color:var(--ink2);border-left:2px solid var(--line);padding-left:10px;margin-left:4px}
.hist div{margin:4px 0}
.prevbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.prevbar b{margin-right:auto}
.paper-wrap{background:#e9edf4;border-radius:10px;padding:16px;overflow:auto}
.a4{background:#fff;width:210mm;min-height:297mm;padding:15mm 15mm 13mm 25mm;margin:0 auto;box-shadow:0 4px 18px rgba(0,0,0,.12);font-family:'Times New Roman',Times,serif;font-size:12pt;line-height:1.35;color:#000}
.a4 p{margin:4px 0}
.dwrap{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 215px);background:#fff}
.dgrid{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;font-size:12.5px}
.dgrid th{position:sticky;top:0;z-index:3;background:#eef3fb;color:var(--ink2);font-weight:600;font-size:12px;text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);border-right:1px solid var(--line2);white-space:nowrap}
.dgrid td{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);padding:0;background:#fff;height:30px}
.dgrid tr:hover td{background:#f7faff}
.dgrid .dstk{position:sticky;z-index:2;background:#fff;padding:0 4px;white-space:nowrap}
.dgrid th.dstk{z-index:4;background:#eef3fb}
.dgrid .dgrp td{background:#e8f0ff;padding:5px 4px;height:auto}
.gin{width:100%;border:0;background:transparent;padding:6px 6px;font:inherit;font-size:12.5px;color:var(--ink);outline:none;text-overflow:ellipsis}
.gin:focus{background:#fff;box-shadow:inset 0 0 0 2px #5b8def;position:relative;z-index:1}
.gin.gc{text-align:center;font-weight:600}
.gin[disabled]{color:#7a869f}
.xgrid{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;font-family:'Times New Roman',Times,serif;font-size:14px;color:#111}
.xgrid th{position:sticky;z-index:3;background:#f2f2f2;font-weight:700;text-align:center;vertical-align:middle;border-right:1px solid #c8c8c8;border-bottom:1px solid #c8c8c8;padding:3px 4px;font-size:13px;line-height:1.2}
.xgrid tr.xl th{top:0;height:22px;font-family:'Be Vietnam Pro',system-ui,sans-serif;font-weight:500;color:#6b7280;font-size:11.5px;background:#f8f9fb}
.xgrid tr.xh th{top:22px;height:48px;background:#fff2cc}
.xgrid tr.xh th.ro{background:#f3ecd6;color:#7a6a3a}
.xgrid td{border-right:1px solid #d9d9d9;border-bottom:1px solid #d9d9d9;padding:3px 5px;height:26px;vertical-align:middle;background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:cell;position:relative}
.xgrid td.wr{white-space:normal;line-height:1.25}
.xgrid td.ro{background:#f6f6f6;color:#555;text-align:center;cursor:default}
.xgrid td.lk{color:#777}
.xgrid td.xa{text-align:center;font-weight:600;color:#c00000}
.xgrid td.on{outline:2px solid #217346;outline-offset:-2px;z-index:1}
.xgrid .xg{position:sticky;left:0;z-index:2;background:#f8f9fb;padding:0 2px;cursor:default;white-space:nowrap;border-right:1px solid #c8c8c8}
.xgrid th.xg{z-index:5}
.xgrid .xa{position:sticky;left:110px;z-index:2}
.xgrid tr.rs td{background:#e3f1e8}.xgrid tr.rs td.ro{background:#d6eadc}.xgrid tr.rs td.xg{background:#cfe7d6}
.xgrid th.xa{z-index:5}
.xgrid tr.xs td{background:#fff;padding:4px 6px;height:auto;cursor:default;border-bottom:1px solid #d9d9d9;overflow:visible}
.xsh{display:flex;gap:10px;align-items:center;position:sticky;left:8px;width:max-content;font-family:'Be Vietnam Pro',system-ui,sans-serif}
.xsh b{color:#d00000;font-family:'Times New Roman',serif;font-size:15px}
.xb{border:0;background:transparent;padding:3px 4px;border-radius:6px;cursor:pointer;color:#4b5875}
.xb:hover{background:#e8eef9}.xb.d{color:#c0392b}
.xed{position:absolute;inset:0;width:100%;min-height:100%;border:2px solid #217346;padding:2px 4px;font:inherit;background:#fff;outline:none;z-index:4;resize:none}
textarea.xed{height:auto;min-height:60px;white-space:normal}
.dwrap:focus{outline:none}
.xgrid td{user-select:none;-webkit-user-select:none}
.xgrid td.sg-chua{color:#6b7280}.xgrid td.sg-in{background:#fff6dc;color:#8a5a00}.xgrid td.sg-trinh{background:#e8f0ff;color:#1d4ed8}.xgrid td.sg-ky{background:#e7f7ec;color:#15803d;font-weight:600}
.xgrid tr.xh th.sgh{background:#dbeafe}
/* misc */
.empty{padding:28px;text-align:center;color:var(--mut)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .in{width:auto}
.modal-bg{position:fixed;inset:0;background:rgba(13,27,58,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:20px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 12px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:200;opacity:0;transition:.25s;pointer-events:none;font-size:13.5px}
.toast.on{opacity:1}
.tplcard{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.tplcard.sel{border-color:#9dbcf7;background:#f7faff}
.tplcard code{font-size:12px;background:var(--grayL);padding:1px 6px;border-radius:6px}
.wbsnode{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.wbsnode>.hd{display:flex;gap:12px;align-items:center;padding:11px 14px;background:#f8fafe}
.guide li{margin:6px 0}
@media (max-width:1280px){.bb{grid-template-columns:250px minmax(0,1fr)}.bb .prevpane{grid-column:1/-1;position:static;max-height:none}}
@media (max-width:980px){
  .side{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:.2s}
  .app.navon .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g3{grid-template-columns:1fr}
  .bb,.bb.noprev,.bb.expand{grid-template-columns:1fr}.pane{position:static;max-height:none}
  .top select{min-width:0;max-width:140px}.saved{display:none}
  .r3{grid-template-columns:1fr 1fr}
}
@media (min-width:981px){.app.navoff .side{display:none}}
#dwrap td.xc[data-ci="1"]{cursor:pointer;color:var(--pri)}#dwrap td.xc[data-ci="1"]:hover{text-decoration:underline}
#printArea{display:none;font-family:'Times New Roman',serif;font-size:12pt;color:#000;line-height:1.15;background:#fff}
#printArea td{line-height:1.05;padding:0 3pt}#printArea p{margin:2pt 0}#printArea table{border-collapse:collapse;width:100%}
#printArea.measure{display:block;position:absolute;left:-20000px;top:0;width:170mm}
#printArea .pp{width:170mm}
#fsGate{position:fixed;inset:0;z-index:99998;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center}
#fsGate .box{background:#fff;border-radius:12px;padding:24px 28px;max-width:440px;box-shadow:0 10px 30px rgba(0,0,0,.3);font:15px system-ui;color:#1e293b}
#pdfOv{display:none;position:fixed;inset:0;z-index:99999;background:rgba(15,23,42,.55);align-items:center;justify-content:center}
#pdfOv .box{background:#fff;border-radius:12px;padding:22px 30px;display:flex;gap:14px;align-items:center;font:600 15px system-ui;color:#1e293b;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#pdfOv .spin{width:22px;height:22px;border:3px solid #cbd5e1;border-top-color:#1e6fd9;border-radius:50%;animation:pdfsp 0.8s linear infinite}
@keyframes pdfsp{to{transform:rotate(360deg)}}
#printArea .pp.fill p{padding-bottom:var(--g)}
#printArea .pp.fill td{padding-top:calc(var(--g)/2)!important;padding-bottom:calc(var(--g)/2)!important}
#printArea .pp.fill td td{padding-top:calc(var(--g)/4)!important;padding-bottom:calc(var(--g)/4)!important}
#printArea.render .pp table{border-collapse:separate!important;border-spacing:0!important}
#printArea.render .pp td{border-top-width:0!important;border-left-width:0!important}
#printArea.render .pp tr:first-child>td{border-top-width:1px!important}
#printArea.render .pp tr>td:first-child{border-left-width:1px!important}
#printArea.render{display:block;position:absolute;left:0;top:0;width:170mm;z-index:-5}
#printArea.render .pp{background:#fff;padding:0}
@media print{@page{size:A4;margin:0}
 html,body.printing{height:auto!important;overflow:visible!important}
 body.printing{display:block!important;margin:0!important;padding:0!important;background:#fff!important;min-width:0!important;width:auto!important}
 body.printing>*:not(#printArea){display:none!important}
 body.printing #printArea{display:block!important;position:static}
 body.printing #printArea .ppo{padding:15mm 15mm 0 25mm;box-sizing:border-box;height:296mm;overflow:hidden;page-break-after:always;break-after:page}
 body.printing #printArea .ppo:last-child{page-break-after:auto;break-after:auto}
 body.printing #printArea .pp{overflow:hidden}}

async function fsReadStrict(dir,name){/* đọc file; phân biệt "chưa có file" với "không đọc được" (bị khóa…) */
  for(let i=0;i<4;i++){try{const f=await (await dir.getFileHandle(name)).getFile();return {txt:await f.text()}}catch(e){if(e&&e.name==='NotFoundError')return {missing:true};await new Promise(r=>setTimeout(r,400))}}return {err:true}}
async function fsLoad(){const dd=await fsData(true);const R=await fsReadStrict(dd,'hoso.json');
  if(R.err){FS.ok=false;fsGate(true,'Không đọc được file <b>data\\hoso.json</b> (có thể đang bị khóa bởi chương trình khác). Dữ liệu <b>không bị thay đổi</b>. Bấm để thử lại.');return}
  const txt=R.txt;await fsSync();FS.ok=true;
  let obj=null;if(txt){try{obj=JSON.parse(txt)}catch(e){toast('File hoso.json bị lỗi – đang dùng bản sao lưu gần nhất');obj=await fsLatestBackup(dd)}}
  else if(R.missing){obj=await fsLatestBackup(dd);if(obj)toast('Không thấy hoso.json – đã nạp bản sao lưu gần nhất')}
  if(!obj&&BLK!=='4.5'){try{const r=JSON.parse(await fsRead(await FS.dir.getDirectoryHandle('data'),'hoso.json'));if(r&&r.templates)obj=blkBlank(r)}catch(e){}}
  if(obj&&Array.isArray(obj.bbnt)){S=obj;if(S._syncStamp==null&&window.SYNC&&S.syncInfo&&S.syncInfo.stamp===window.SYNC.stamp)S._syncStamp=String(window.SYNC.stamp)}
  CLD.boot=true;postLoad();CLD.boot=false;
  FS.ok=true;fsGate(false);FS.lastMod=await fsMod();await fsInbox();await fsSaveNow();render();fsStat('💾 Lưu tại '+esc(FS.dir.name)+'\\data'+(BLK==='4.5'?'':'\\'+esc(BLK)));setTimeout(()=>xaRun(false),200)}
async function fsLatestBackup(dd){try{const b=await dd.getDirectoryHandle('backup',{create:true});let best=null;for await(const [n,h] of b.entries()){if(/^hoso_.*\.json$/.test(n)&&(!best||n>best[0]))best=[n,h]}if(!best)return null;return JSON.parse(await (await best[1].getFile()).text())}catch(e){return null}}
function fsSoon(){if(!FS.ok)return;clearTimeout(FS.t);fsStat('⟳ Đang lưu…');FS.t=setTimeout(fsSaveNow,1200)}
async function fsMod(){try{const dd=await fsData();return (await (await dd.getFileHandle('hoso.json')).getFile()).lastModified}catch(e){return 0}}
async function fsInbox(){/* D:\QuanLyHoSo\data\inbox\*.json: dữ liệu gửi vào app (vd. kỳ thanh toán) – nạp rồi xóa file */
  if(!FS.dir)return 0;let n=0;try{const dd=await fsData(true);const ib=await dd.getDirectoryHandle('inbox',{create:true});const done=[];
    for await(const [name,h] of ib.entries()){if(!/\.(json|qlhs)$/i.test(name)||h.kind!=='file')continue;try{const o=JSON.parse(await (await h.getFile()).text());
      if(o.replacePayments&&Array.isArray(o.payments)){S.payments=o.payments;n+=o.payments.length;o.payments=[]}
      (o.payments||[]).forEach(p=>{if(p&&p.id&&!S.payments.some(x=>x.id===p.id)){S.payments.push(p);n++}});done.push(name)}catch(e){console.error(e)}}
    for(const nm of done)await ib.removeEntry(nm)}catch(e){console.error(e)}
  if(n){save();render();toast('Đã cập nhật '+n+' kỳ thanh toán')}return n}
async function fsExternal(){/* file hoso.json bị sửa từ bên ngoài (Claude, máy khác…) sau lần đọc/ghi cuối của app → nạp lại thay vì ghi đè */
  if(!FS.ok||!FS.dir||FS.lastMod==null)return false;const m=await fsMod();if(!m||m<=FS.lastMod+500)return false;
  try{const dd=await fsData();const obj=JSON.parse(await (await (await dd.getFileHandle('hoso.json')).getFile()).text());if(!obj||!Array.isArray(obj.bbnt))return false;
    S=obj;CLD.boot=true;postLoad();CLD.boot=false;FS.lastMod=m;render();toast('Đã nạp dữ liệu mới trong ổ D: (file vừa được cập nhật)');return true}catch(e){console.error(e);return false}}
async function fsSaveNow(){if(!FS.ok||!FS.dir)return;if(FS.busy){FS.again=true;return}FS.busy=true;
  try{if(await fsExternal()){FS.busy=false;return}const dd=await fsData(true);const j=JSON.stringify(S);await fsWrite(dd,'hoso.json',j);FS.lastMod=await fsMod();
    const bd=await dd.getDirectoryHandle('backup',{create:true});const nm='hoso_'+nowISO().slice(0,10)+'.json';await fsWrite(bd,nm,j);
    const L=[];for await(const [n] of bd.entries())if(/^hoso_.*\.json$/.test(n))L.push(n);L.sort();for(const n of L.slice(0,Math.max(0,L.length-30)))await bd.removeEntry(n);
    const d=new Date();fsStat(`💾 Đã lưu ổ D ${pad(d.getHours())}:${pad(d.getMinutes())}`)}
  catch(e){console.error(e);fsStat('<span style="color:#b45309">⚠ Chưa lưu được vào ổ D – '+esc(e.message||'')+'</span>')}
  FS.busy=false;if(FS.again){FS.again=false;fsSaveNow()}}

}

function libSample(t){/* hồ sơ mẫu để xem trước checklist: lấy hồ sơ gần nhất đang dùng checklist này, không có thì lấy hồ sơ bất kỳ */
  const has=b=>(b.cls||[]).some(c=>c.tpl===t.id);const L=S.bbnt.filter(has).sort((a,b)=>String(b.start||'').localeCompare(String(a.start||'')));
  const src=L[0]||S.bbnt.slice().sort((a,b)=>String(b.start||'').localeCompare(String(a.start||'')))[0];
  const b=JSON.parse(JSON.stringify(src||{id:'_smp',no:'1/NOQ/CEN/KC/'+BLK+'/MA/BBNT',pycNo:'',viTri:'(vị trí)',title:'',start:nowISO(),sig:{},docs:{}}));
  const c0=(src&&(src.cls||[]).find(c=>c.tpl===t.id))||{};const no=c0.no||String(b.no||'').replace(/\/BBNT$/,'')+'/BBKT';
  const m=mkCls(S,[t.id],[no])[0]||{tpl:t.id,no,checks:[]};m.numStyle=t.numStyle||m.numStyle;b.cls=[m];return b}
function libBlank(t){/* tờ checklist A4 trống theo mẫu */const no='';const m=mkCls(S,[t.id],[no],true)[0]||{tpl:t.id,no,checks:[]};m.numStyle=t.numStyle||m.numStyle;
  return {id:'_blank',no:'',pycNo:'',viTri:'',title:'',start:'',end:'',pycDate:'',clDate:'',sig:{},docs:{},cls:[m]}}
function libSheet(id){const t=tplGet(S,id,true);if(!t)return;let h='';try{h=docCL(libBlank(t),0)}catch(e){console.error(e);h='<p>Không tạo được phiếu</p>'}UI.libSheet=h;

function libPreview(t){if(!t)return'';try{return docCL(libSample(t),0)}catch(e){console.error(e);return '<p class="mut">Không xem trước được</p>'}}

V.plan=()=>{
  const F=UI.planF,q=UI.planQ.toLowerCase();
  let ps=S.plans.slice().sort((a,b)=>a.date.localeCompare(b.date));
  ps=ps.filter(p=>{const s=planStatus(p);if(F==='overdue'&&s!=='overdue')return false;if(F==='todo'&&s!=='none')return false;if(F==='made'&&!bOfPlan(p.id))return false;if(q&&!p.title.toLowerCase().includes(q))return false;return true});
  const c=k=>S.plans.filter(p=>k==='made'?bOfPlan(p.id):planStatus(p)===(k==='todo'?'none':k)).length;
  return `<div class="head"><div><h1>Kế hoạch nghiệm thu</h1></div><button class="btn p" data-act="addPlan">${ic('plus',16)} Thêm kế hoạch</button></div>
  <div class="toolbar"><div class="tabs" style="margin:0">${[['all','Tất cả',S.plans.length],['overdue','Quá hạn',c('overdue')],['todo','Sắp tới',c('todo')],['made','Đã lập',c('made')]].map(([k,l,n])=>`<button class="${F===k?'on':''}" data-act="planF" data-id="${k}">${l} (${n})</button>`).join('')}</div>
  <input class="in" style="width:240px;margin-left:auto" placeholder="Tìm công việc…" data-pq="1" value="${esc(UI.planQ)}"></div>
  <div class="card" style="padding:0"><div class="tbox" style="border:0"><table class="t"><tr><th style="width:190px">Ngày giờ dự kiến</th><th>Nội dung nghiệm thu</th><th>Khu vực</th><th>Checklist</th><th>Trạng thái</th><th style="width:150px"></th></tr>
  ${ps.map(p=>{const t=task(p.taskId)||{};const b=bOfPlan(p.id);const s=planStatus(p);return `<tr><td><input class="tin" type="datetime-local" data-bind="row:plans:${p.id}:date" data-rr="1" value="${p.date}"></td>
   <td><input class="tin" data-bind="row:plans:${p.id}:title" value="${esc(p.title)}"></td><td>${esc(t.hm||'')}</td><td class="mut">${esc(clCodes(t.tpls)||'—')}</td><td>${chip(s)}${b?` <span class="mut small">${esc(b.no)}</span>`:''}</td>
   <td style="text-align:right">${b?`<button class="btn sm" data-act="open" data-id="${b.id}">Mở</button>`:`<button class="btn sm p" data-act="make" data-id="${p.id}">${ic('doc',14)} Lập</button> <button class="btn sm ghost d" data-act="del" data-id="plans:${p.id}">${ic('trash',15)}</button>`}</td></tr>`}).join('')||`<tr><td colspan="6" class="empty">Không có dòng nào</td></tr>`}
  </table></div></div>`;

const SG={chua:{t:'Chưa in',c:'gray'},in:{t:'Đã in – chờ ký',c:'amber'},trinh:{t:'Đang trình ký',c:'blue'},ky:{t:'Đã ký',c:'green'}};

function splitDupSec(rows){/* nhóm trùng tên trong Excel (VD "Hoàn công móng" B3 và B2) → tách thành nhóm riêng */
  if(S.splitSec1)return;S.splitSec1=true;const secN={};let sec='',occ=1,prevT=null;let moved=0;
  for(let r=21;r<rows.length;r++){const R=rows[r]||[];const S18=String(R[18]==null?'':R[18]).trim();
    if(!S18){const a=String(R[0]==null?'':R[0]).trim();if(a&&isNaN(+a)){sec=a;secN[a]=(secN[a]||0)+1;occ=secN[a]}continue}
    const T=String(R[19]==null?'':R[19]).trim()||S18.replace(/YCNT$/,'BBNT');const W=String(R[22]==null?'':R[22]).replace(/\s+/g,' ').trim();
    const b=S.bbnt.find(x=>x.no===T&&String(x.viTri||'').replace(/\s+/g,' ').trim()===W);if(!b)continue;const t=task(b.taskId);
    if(t&&occ>1&&t.name===sec&&(t.occ||1)!==occ){let nt=S.tasks.find(x=>x.name===sec&&x.hm===t.hm&&x.occ===occ);
      if(!nt){nt=Object.assign({},t,{id:uid(),occ,wbs:(numCode(S18,BLK)||t.wbs)});const i=prevT?S.tasks.indexOf(prevT):-1;if(i>=0)S.tasks.splice(i+1,0,nt);else S.tasks.push(nt)}
      b.taskId=nt.id;const p=S.plans.find(x=>x.id===b.planId);if(p)p.taskId=nt.id;moved++}
    prevT=task(b.taskId)}
  if(moved)save()}

const pNorm=s=>String(s||'').toLowerCase().replace(/bê\s*tông/g,'').replace(/block\s*b?4\.\d/g,'').replace(/tầm/g,'tầng').replace(/[^0-9a-zà-ỹđ\/'\-]/g,'');
const pKey=p=>p.d+'|'+pNorm(p.desc);
const pTok=s=>new Set((String(s||'').toLowerCase().match(/[0-9a-z']+(?:-[0-9a-z']+)?(?:\/[0-9a-z'\-]+)*/g)||[]).filter(x=>/\d/.test(x)));
function pSim(a,b){const A=pNorm(a),B=pNorm(b);if(!A||!B)return 0;if(A.includes(B)||B.includes(A))return 1;const x=pTok(a),y=pTok(b);if(!x.size||!y.size)return 0;let n=0;x.forEach(t=>{if(y.has(t))n++});return n/Math.max(x.size,y.size)}

const ymd=iso=>String(iso||'').slice(0,10);

const shiftISO=(iso,n)=>iso?addDays(iso,n).slice(0,10)+String(iso).slice(10):iso;

function render(){
  const keep={};['formPane','bListPane','prevPane','paperWrap','dwrap'].forEach(id=>{const e=document.getElementById(id);if(e)keep[id]=e.scrollTop});
  const ws=window.scrollY;
  $('#view').innerHTML=(V[UI.view]||V.dashboard)();
  const same=UI._lastSel===UI.sel;UI._lastSel=UI.sel;
  Object.keys(keep).forEach(id=>{if(!same&&id!=='bListPane'&&id!=='dwrap')return;const e=document.getElementById(id);if(e)e.scrollTop=keep[id]});const dw=document.getElementById('dwrap');if(dw&&UI._dsl!=null)dw.scrollLeft=UI._dsl;if(dw)dw.onscroll=()=>{UI._dsl=dw.scrollLeft};
  window.scrollTo(0,ws);

function go(v){
  let sub=null;if(v.includes(':'))[v,sub]=v.split(':');
  UI.view=v;if(v==='input'&&sub)UI.inTab=sub;if(v==='bbnt'&&sub){UI.f.st=sub;UI.sel=null}
  if(location.hash!=='#'+v){try{history.replaceState(null,'','#'+v)}catch(e){}}
  if(window.innerWidth<=980)$('#app').classList.remove('navon');
  render();window.scrollTo(0,0);
}

const DX={W:9638};

  return c}

function dxInline(el,c,runs){el.childNodes.forEach(n=>{if(n.nodeType===3){const t=n.nodeValue.replace(/\s+/g,' ');if(t)runs.push(dxRun(t,c))}

const DXBLOCK=new Set(['DIV','P','TABLE','H1','H2','H3']);
function dxBlocks(el,c){let res='',runs=[];
  const flush=()=>{while(runs.length&&/^<w:r><w:rPr>[^]*?<w:t xml:space="preserve"> <\/w:t><\/w:r>$/.test(runs[0]))runs.shift();if(runs.length)res+=dxPara(runs,c);runs=[]};
